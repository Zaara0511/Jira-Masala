<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 44" fill="none">
  <defs>
    <!-- Jira Blue Gradient -->
    <linearGradient id="jira-blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Masala Spice Gradient -->
    <linearGradient id="masala-spice-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
  </defs>

  <!-- Mark: Dual Jira Chevrons with Masala Accent -->
  <g transform="translate(6, 4)">
    <!-- Base / Primary Chevron (Jira Blue) -->
    <path
      d="M17.8 4.2C17.2 3.6 16.2 3.6 15.6 4.2L4.6 15.2C4.0 15.8 4.0 16.8 4.6 17.4L15.6 28.4C16.2 29.0 17.2 29.0 17.8 28.4C18.4 27.8 18.4 26.8 17.8 26.2L8.2 16.6C7.8 16.2 7.8 15.6 8.2 15.2L17.8 5.6C18.4 5.0 18.4 4.8 17.8 4.2Z"
      fill="url(#jira-blue-grad)"
    />
    <!-- Complementary Masala Chevron (Spicy Amber-Red) -->
    <path
      d="M21.2 9.2C20.6 8.6 19.6 8.6 19.0 9.2L12.4 15.8C11.8 16.4 11.8 17.4 12.4 18.0L21.2 26.8C21.8 27.4 22.8 27.4 23.4 26.8C24.0 26.2 24.0 25.2 23.4 24.6L16.2 17.4C15.8 17.0 15.8 16.4 16.2 16.0L21.2 11.0C21.8 10.4 21.8 9.8 21.2 9.2Z"
      fill="url(#masala-spice-grad)"
    />
    <!-- Masala Spice Spark -->
    <circle cx="27" cy="7" r="3.2" fill="url(#masala-spice-grad)" />
  </g>

  <!-- Wordmark -->
  <text x="46" y="28.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.03em">
    <tspan fill="#0F172A">Jira</tspan>
    <tspan fill="#EA580C">-</tspan>
    <tspan fill="url(#masala-spice-grad)">Masala</tspan>
  </text>
</svg>